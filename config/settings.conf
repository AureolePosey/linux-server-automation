# shellcheck shell=bash
 # Utilisateur de deploiement 

DEPLOY_USER="deploy"
SSH_PORT=22
 
 # Configuration du site 

SITE_NAME="mon-site.local"
SITE_PORT=80
WEB_ROOT="/var/www/mon-site"

 # Configuration des sauvegardes

BACKUP_SOURCE="$WEB_ROOT"
BACKUP_DEST="/var/backups/mon-site"
BACKUP_RETENTION=5


 # Dossier des logs de l'outil

LOG_DIR="/var/log/devops-tool"


 # Listes des paquets a installer 

PACKAGES=(nginx git curl unzip ufw)


 # Services a surveiller 

SERVICES=(nginx ssh)
